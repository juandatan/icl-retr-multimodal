# Reranker Training Configuration
# Train an MLP to predict marginal utility from CLIP embeddings

# Experiment metadata
experiment:
  name: "reranker_clip_mlp"
  description: "MLP reranker to predict marginal utility from CLIP embeddings"
  seed: 42

# Data configuration
data:
  # Local paths (used when running locally)
  use_embeddings: true
  results_path: "outputs/marginal_utilities/marginal_utility_stanford_cars/marginal_utilities_train.pkl"
  embeddings_path: "data/stanford_cars/clip_embeddings_train.pkl"

  # Kaggle paths (used when running in Kaggle notebooks)
  # Add these datasets to your notebook inputs:
  #   1. juandatan/marginal-utility-training-data
  #   2. juandatan/stanford-cars-clip
  kaggle_results_path: "/kaggle/input/d/juandatan/marginal-utility-training-data/marginal_utilities_train.pkl"
  kaggle_embeddings_path: "/kaggle/input/d/juandatan/stanford-cars-clip/clip_embeddings_train.pkl"

  # Split ratios (handled by MarginalUtilityDataset)
  train_ratio: 0.8  # Split by queries, not pairs
  val_ratio: 0.1
  test_ratio: 0.1

  # Data volume ablation: if utility data was generated at n=50, set top_k=10 or
  # top_k=20 to train on a smaller candidate set without re-running LLaVA inference.
  # Candidates are ranked by per-query similarity, so top_k=10 gives the 10 most
  # similar examples per query. null = use all candidates in the file.
  top_k: null

  # Contrastive training mode. Requires top_k to be set, and that data was generated
  # with the contrastive collection strategy (retrieval.contrastive_max_pool in the
  # data generation config), which guarantees every query has both positive and
  # negative utility examples in its full candidate pool.
  # Options:
  #   'none'         — top-k by similarity only, no contrastiveness guarantee (default)
  #   'contrastive'  — top-k by similarity, but swap in the nearest opposite-sign
  #                    candidate when the top-k is entirely one sign
  contrastive_mode: "none"

# Model configuration
model:
  # Architecture type: "mlp" or "cross_attention"
  architecture: "mlp"  # Use "cross_attention" for attention-based reranker

  embedding_dim: 512  # CLIP ViT-B/32 embedding dimension

  # MLP-specific configuration (only used when architecture="mlp")
  hidden_dims: [512, 256, 128]  # Original 3-layer architecture

  # Interaction features for MLP (only used when architecture="mlp")
  use_product: false  # Element-wise product of embeddings
  use_difference: false  # Element-wise difference of embeddings
  use_l2_distance: false  # L2 distance between embeddings

  # Cross-attention specific configuration (only used when architecture="cross_attention")
  hidden_dim: 256  # Hidden dimension for attention (must be divisible by num_attention_heads)
  num_attention_heads: 8  # Number of attention heads
  num_attention_layers: 2  # Number of cross-attention layers to stack
  feedforward_dims: [256, 128]  # Feedforward layer dimensions after attention

  # Common configuration
  dropout: 0.1  # Dropout for regularization

  # Output activation
  use_sigmoid: false  # If true, apply sigmoid to output (bounds predictions to [0,1])
                      # Automatically enabled when loss_type="bce"

# Training configuration
training:
  batch_size: 256  # Batch size for training
  num_epochs: 100  # Maximum number of epochs
  learning_rate: 1e-4  # Initial learning rate
  weight_decay: 1e-5  # L2 regularization
  gradient_clip: 1.0  # Gradient clipping threshold
  early_stopping_patience: 10  # Stop if no improvement for N epochs

  # Loss function configuration
  loss_type: "huber"  # Options: "mse", "huber", "ranking", "bce"
  huber_delta: 1.0  # Delta parameter for Huber loss (only used if loss_type="huber")
  ranking_margin: 0.1  # Margin for ranking loss (only used if loss_type="ranking")
  pairs_per_query: 10  # Number of pairs per query for ranking loss

  # Utility normalization
  normalize_utilities: false

  # Learning rate scheduler
  # "cosine": CosineAnnealingLR stepping per epoch (default, suits MLP)
  # "one_cycle": OneCycleLR with warmup stepping per batch (suits transformers)
  lr_scheduler: "cosine"
  max_lr: 1e-3              # peak LR for one_cycle; ignored for cosine
  warmup_pct: 0.1           # fraction of total steps for warmup; ignored for cosine
  div_factor: 25.0          # initial_lr = max_lr / div_factor; PyTorch default
  final_div_factor: 1e4     # final_lr = initial_lr / final_div_factor; PyTorch default  # If true, normalize utilities to [0,1] via min-max scaling
                              # Automatically enabled when loss_type="bce"
                              # Recommended for: BCE loss (required), ranking loss (optional)

  # Note on BCE loss (mimics reference paper methodology):
  # When loss_type="bce", both normalize_utilities and use_sigmoid are auto-enabled
  # The loss becomes: -u*log(M) - (1-u)*log(1-M) where u,M ∈ [0,1]

# Checkpoint configuration
checkpoint:
  enabled: true
  save_dir: "outputs/reranker_checkpoints"
  save_best_only: false  # Also save periodic checkpoints
  save_interval: 10  # Save checkpoint every N epochs
  overwrite: false  # If true, ignore any existing checkpoint and train from scratch

# Logging configuration
logging:
  use_wandb: false  # Enable Weights & Biases logging
  wandb_project: "icl-retrieval-multimodal"
  wandb_entity: null  # Your WandB username/team
  log_interval: 10  # Log metrics every N batches

# Device configuration
use_mps: true  # Use Apple Metal Performance Shaders if available
