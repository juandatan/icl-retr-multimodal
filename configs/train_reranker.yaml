experiment:
  # "auto" derives a readable name plus a stable config fingerprint.
  name: auto
  seed: 42

data:
  artifact_path: /workspace/icl-artifacts/cub-200-reranker-teacher-data-v2/reranker_teacher_data.pkl
  # Required only by visual_token_cross_encoder. This directory is produced by
  # scripts/build_reranker_visual_token_cache.py.
  visual_token_cache_path: null
  train_split: train
  val_split: val
  # Paper-aligned first target. Controlled alternatives: bounded_margin,
  # bounded_incremental_margin, normalized_incremental_probability.
  target: true_probability
  target_temperature: 1.0
  incremental_lambda: 1.0
  batch_size: 64
  num_workers: 0
  max_train_queries: null
  max_val_queries: null

model:
  architecture: interaction_mlp
  hidden_dim: 256
  metadata_dim: 64
  dropout: 0.1
  # Minimal first experiment: only query image, exemplar image, and exemplar
  # label embeddings in the shared SigLIP space.
  use_clip_embeddings: false
  use_clip_similarity: false
  use_retrieval_rank: false
  use_derived_siglip_similarities: false
  transformer_layers: 2
  transformer_heads: 4
  transformer_ff_dim: 1024
  # Used only by cross_candidate_attention. No positional embeddings are added.
  candidate_context_layers: 1
  candidate_context_heads: 4
  candidate_context_ff_dim: 512
  # Used only by visual_token_cross_encoder. Idefics2 token dimensions are read
  # from the cache rather than configured manually.
  visual_token_layers: 2
  visual_token_heads: 4
  visual_token_ff_dim: 1024
  visual_candidate_chunk_size: 10

objective:
  # Options: pointwise_bce, pairwise, listwise_correctness,
  # hybrid_listwise_pairwise, huber.
  # listwise_correctness skips queries with no teacher-correct candidate.
  name: pointwise_bce
  hybrid_listwise_weight: 0.25
  pairwise_min_target_gap: 0.02
  pairwise_score_temperature: 1.0
  huber_delta: 1.0

optimization:
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  # This is accuracy within the artifact's K=32 teacher label set. Full K=200
  # evaluation is a separate post-training Idefics2 run.
  monitor: restricted_selected_accuracy
  monitor_mode: max
  secondary_monitor: mean_margin_regret
  secondary_monitor_mode: min
  amp: false

logging:
  # Visual-token epochs can be long. Emit a flushed train/validation heartbeat
  # at this interval; the complete metrics block is still printed once per epoch.
  # Set to 0 to disable heartbeats.
  progress_every_seconds: 60

output:
  dir: outputs/reranker_training
