# Marginal Utility Computation Configuration - Class Balanced
# This config generates a balanced dataset with equal representation of
# same-class and different-class examples to address utility distribution skew

# Experiment metadata
experiment:
  name: "marginal_utility_stanford_cars_balanced"
  description: "Compute marginal utility with class-balanced sampling (50-50 same/diff class)"
  tags: ["icl", "marginal_utility", "stanford_cars", "class_balanced"]
  seed: 42

# Dataset configuration
dataset:
  name: "stanford_cars"
  split: "train"  # Which split to compute utilities for
  class_split_seed: 42  # Seed for reproducible class splits
  cache_dir: "data/stanford_cars"

# Retrieval configuration
retrieval:
  method: "clip_similarity"  # Method for retrieving candidate examples
  clip_model: "ViT-B/32"  # CLIP model used for embeddings
  top_k: 30  # Number of candidates to retrieve per query
  exclude_same_class: false  # Must be false for class-balanced sampling
  use_train_as_pool: true  # Use training set as retrieval pool

  # Class-balanced sampling configuration
  use_class_balanced_sampling: true  # Enable class-balanced sampling
  same_class_ratio: 0.5  # Ratio of same-class examples (0.5 = 50% same, 50% different)
  pool_size: 500  # Size of candidate pool to sample from

  # NOTE: use_stratified_sampling is disabled when use_class_balanced_sampling is true
  use_stratified_sampling: false

# Model configuration
model:
  name: "llava-hf/llava-1.5-7b-hf"
  load_in_8bit: false  # Use 8-bit quantization (requires CUDA)
  load_in_4bit: false  # Use 4-bit quantization (requires CUDA)
  device_map: "auto"  # Automatic device placement
  torch_dtype: "float16"  # Use fp16 for efficiency

# Computation configuration
computation:
  batch_size: 1  # Batch size for LLaVA inference
  baseline_batch_size: 1  # Batch size for baseline computation
  num_workers: 0  # Number of data loading workers
  cache_baselines: true  # Cache baseline probabilities to disk
  baseline_cache_path: "data/stanford_cars/baseline_probs_{split}.pkl"

# Checkpoint configuration
checkpoint:
  enabled: true  # Enable checkpointing for resumption
  save_dir: "outputs/marginal_utilities"
  save_interval: 100  # Save checkpoint every N queries
  resume_from: null  # Path to checkpoint to resume from

# Output configuration
output:
  save_dir: "outputs/marginal_utilities"
  save_format: "pickle"
  save_individual_results: false
  log_interval: 10

# Logging configuration
logging:
  use_wandb: true
  wandb_project: "icl-retrieval-multimodal"
  wandb_entity: null
  wandb_mode: "online"
  log_frequency: 10
  save_artifacts: true

# Resource limits
limits:
  max_queries: null  # null = process all queries
  timeout_per_query: 300
  memory_limit_gb: null
