# Marginal Utility Computation Configuration - Stanford Cars
# Fine-grained classification dataset with 196 car model classes.
# Generates contrastive candidate sets (both positive and negative utility)
# per query, up to contrastive_max_pool, to support data volume ablations
# and contrastive/non-contrastive training splits from a single dataset.

# Experiment metadata
experiment:
  name: "marginal_utility_stanford_cars"
  description: "Compute marginal utility scores for Stanford Cars (196 fine-grained classes)"
  tags: ["icl", "marginal_utility", "stanford_cars"]
  seed: 42

# Dataset configuration
dataset:
  name: "stanford_cars"
  split: "train"
  class_split_seed: 42
  cache_dir: "data/stanford_cars"

# Retrieval configuration
retrieval:
  method: "clip_similarity"
  clip_model: "ViT-B/32"
  top_k: 50  # Minimum candidates per query. Each query expands beyond this until
             # both positive and negative utility examples are found (contrastive
             # collection), so the stored set may be slightly larger than top_k.
  exclude_same_class: false
  use_train_as_pool: true

  # Maximum candidate pool size per query for contrastive collection.
  # If a contrastive set cannot be found within this many candidates, the query
  # is stored as-is with a warning. Set to top_k * 5 as a safe default.
  contrastive_max_pool: 250

  # Disable stratified sampling — contrastive collection already ensures
  # diversity of utility signs; stratification by similarity is not needed.
  use_stratified_sampling: false

# Model configuration
model:
  name: "HuggingFaceM4/idefics2-8b"
  load_in_8bit: false  # Set to true if GPU memory < 16GB
  load_in_4bit: false  # Set to true if GPU memory < 12GB
  device_map: "auto"
  torch_dtype: "float16"

# Computation configuration
computation:
  batch_size: 5
  baseline_batch_size: 8
  num_workers: 0
  cache_baselines: true
  baseline_cache_path: "data/stanford_cars/baseline_probs_{split}.pkl"

# Checkpoint configuration
checkpoint:
  enabled: true
  save_dir: "outputs/marginal_utilities"
  save_interval: 100
  resume_from: null
  kaggle_dataset: "juandatan/stanford-cars-utility-checkpoints"  # Kaggle dataset for checkpoint persistence

# Output configuration
output:
  save_dir: "outputs/marginal_utilities"
  save_format: "pickle"
  save_individual_results: false
  log_interval: 10

# Logging configuration
logging:
  use_wandb: true
  wandb_project: "icl-retrieval-multimodal"
  wandb_entity: null
  wandb_mode: "online"
  log_frequency: 10
  save_artifacts: true

# Resource limits
limits:
  max_queries: null
  timeout_per_query: 300
  memory_limit_gb: null
