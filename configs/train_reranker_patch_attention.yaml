# Patch-Level Cross-Attention Reranker Configuration
# Operates on image patches instead of pre-computed CLIP embeddings

experiment:
  name: "reranker_patch_attention"
  description: "Patch-level cross-attention reranker operating on raw images"
  seed: 42

# Data configuration
data:
  # Dataset name (stanford_cars, mini_imagenet, etc.)
  dataset_name: "stanford_cars"

  # Marginal utility results
  results_path: "outputs/marginal_utilities/marginal_utility_stanford_cars/marginal_utilities_train.pkl"

  # Kaggle paths
  kaggle_results_path: "/kaggle/input/d/juandatan/marginal-utility-training-data/marginal_utilities_train.pkl"

  # Split ratios
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Model configuration
model:
  architecture: "patch_attention"  # New architecture type

  # CLIP model to use for patch extraction
  clip_model_name: "ViT-B/32"  # Options: "ViT-B/32", "ViT-B/16", "ViT-L/14"

  # Cross-attention configuration
  hidden_dim: 256  # Hidden dimension for attention
  num_attention_heads: 8  # Number of attention heads
  num_attention_layers: 2  # Number of cross-attention layers
  feedforward_dims: [256, 128]  # FFN after pooling

  # Training configuration
  dropout: 0.2  # Higher dropout for regularization
  freeze_clip: true  # Freeze CLIP weights (recommended)
  pooling_method: "cls"  # "cls", "mean", or "max"

  # Output activation
  use_sigmoid: false

  # Image preprocessing
  image_size: 224  # CLIP input size

# Training configuration
training:
  batch_size: 32  # Smaller batch size (images are larger than embeddings)
  num_epochs: 50  # Fewer epochs (slower per epoch)
  learning_rate: 1e-5  # Lower LR for fine-tuning
  weight_decay: 1e-4  # Stronger regularization
  gradient_clip: 1.0
  early_stopping_patience: 10

  # Loss function
  loss_type: "huber"
  huber_delta: 1.0
  normalize_utilities: false

# Checkpoint configuration
checkpoint:
  enabled: true
  save_dir: "outputs/reranker_checkpoints"
  save_best_only: false
  save_interval: 5

# Logging configuration
logging:
  use_wandb: false
  wandb_project: "icl-retrieval-multimodal"
  wandb_entity: null
  log_interval: 5

# Device configuration
use_mps: true
