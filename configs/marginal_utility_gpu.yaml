# GPU-Optimized Marginal Utility Computation Configuration
# Use this config when running on GPU (CUDA) for much faster inference

# Experiment metadata
experiment:
  name: "marginal_utility_stanford_cars"
  description: "GPU-optimized marginal utility computation"
  tags: ["icl", "marginal_utility", "stanford_cars", "gpu"]
  seed: 42

# Dataset configuration
dataset:
  name: "stanford_cars"
  split: "train"
  class_split_seed: 42
  cache_dir: "data/stanford_cars"

# Retrieval configuration
retrieval:
  method: "clip_similarity"
  clip_model: "ViT-B/32"
  top_k: 30  # Number of candidates per query (increased for better coverage)
  exclude_same_class: false
  use_train_as_pool: true

  # Stratified sampling configuration
  use_stratified_sampling: true  # Enable stratified sampling by similarity ranges
  pool_size: 500  # Size of candidate pool to sample from (larger = better coverage)

  # Define sampling strategy across similarity percentiles
  # Percentiles are based on similarity ranking (0 = most similar, 100 = least similar among top pool_size)
  # sample_ratio: proportion of top_k to sample from this range (should sum to ~1.0)
  stratification:
    - percentile: [0, 20]      # Top 20% most similar
      sample_ratio: 0.33       # ~33% of samples from this range
    - percentile: [20, 60]     # Middle 40%
      sample_ratio: 0.40       # ~40% of samples from this range
    - percentile: [60, 100]    # Bottom 40%
      sample_ratio: 0.27       # ~27% of samples from this range
  # With top_k=30: 10 from top-20%, 12 from middle-40%, 8 from bottom-40%

# Model configuration
model:
  name: "llava-hf/llava-1.5-7b-hf"
  load_in_8bit: false  # Set to true if GPU memory < 16GB
  load_in_4bit: false  # Set to true if GPU memory < 12GB
  device_map: "auto"
  torch_dtype: "float16"  # Use fp16 for GPU efficiency

# Computation configuration - GPU OPTIMIZED
computation:
  batch_size: 4  # Reduced from 20 to avoid CUDA OOM with 8-bit quantization
  baseline_batch_size: 8  # Reduced from 32 to be conservative
  num_workers: 0
  cache_baselines: true
  baseline_cache_path: "data/stanford_cars/baseline_probs_{split}.pkl"

# Checkpoint configuration
checkpoint:
  enabled: true
  save_dir: "outputs/marginal_utilities"
  save_interval: 100
  resume_from: null

# Output configuration
output:
  save_dir: "outputs/marginal_utilities"
  save_format: "pickle"
  save_individual_results: false
  log_interval: 10

# Logging configuration
logging:
  use_wandb: false  # Disable for faster iteration
  wandb_project: "icl-retrieval-multimodal"
  wandb_entity: null
  wandb_mode: "offline"
  log_frequency: 10
  save_artifacts: false

# Resource limits
limits:
  max_queries: null  # Process all queries
  timeout_per_query: 300
  memory_limit_gb: null
