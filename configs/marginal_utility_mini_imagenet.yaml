# Marginal Utility Computation Configuration - Mini-ImageNet
# This config defines parameters for computing marginal utility scores
# on Mini-ImageNet, which has 100 diverse classes (vs Stanford Cars' 196 fine-grained classes)
#
# Hypothesis: Mini-ImageNet's semantic diversity should yield stronger marginal utility
# signals compared to Stanford Cars' fine-grained similarity.

# Experiment metadata
experiment:
  name: "marginal_utility_mini_imagenet"
  description: "Compute marginal utility scores for Mini-ImageNet (100 diverse classes)"
  tags: ["icl", "marginal_utility", "mini_imagenet", "diverse_classes"]
  seed: 42

# Dataset configuration
dataset:
  name: "mini_imagenet"
  split: "train"  # Which split to compute utilities for
  class_split_seed: 42  # Seed for reproducible class splits (80/10/10 = 80/10/10 classes)
  cache_dir: "data/mini_imagenet"

# Retrieval configuration
retrieval:
  method: "clip_similarity"  # Method for retrieving candidate examples
  clip_model: "ViT-B/32"  # CLIP model used for embeddings
  top_k: 30  # Number of candidates to retrieve per query
  exclude_same_class: false  # Whether to exclude same-class examples
  use_train_as_pool: true  # Use training set as retrieval pool

  # Stratified sampling configuration
  # Note: With Mini-ImageNet's diversity, we expect clearer stratification by utility
  use_stratified_sampling: true  # Enable stratified sampling by similarity ranges
  pool_size: 500  # Size of candidate pool to sample from

  # Define sampling strategy across similarity percentiles
  # With diverse classes, we expect:
  # - High similarity examples: same class, high utility
  # - Mid similarity: related classes (e.g., different animals), moderate utility
  # - Low similarity: unrelated classes (animals vs objects), low/negative utility
  stratification:
    - percentile: [0, 20]      # Top 20% most similar
      sample_ratio: 0.33       # ~33% of samples (10/30 examples)
    - percentile: [20, 60]     # Middle 40%
      sample_ratio: 0.40       # ~40% of samples (12/30 examples)
    - percentile: [60, 100]    # Bottom 40%
      sample_ratio: 0.27       # ~27% of samples (8/30 examples)

# Model configuration
model:
  name: "HuggingFaceM4/idefics2-8b"
  load_in_8bit: false  # Use 8-bit quantization (requires CUDA)
  load_in_4bit: false  # Use 4-bit quantization (requires CUDA)
  device_map: "auto"  # Automatic device placement
  torch_dtype: "float16"  # Use fp16 for efficiency (falls back to fp32 on CPU)

# Computation configuration
computation:
  batch_size: 1  # Batch size for Idefics2 inference (1 for CPU, 4-8 for GPU)
  baseline_batch_size: 1  # Batch size for baseline computation (1 for CPU, 8+ for GPU)
  num_workers: 0  # Number of data loading workers
  cache_baselines: true  # Cache baseline probabilities to disk
  baseline_cache_path: "data/mini_imagenet/baseline_probs_{split}.pkl"

# Checkpoint configuration
checkpoint:
  enabled: true  # Enable checkpointing for resumption
  save_dir: "outputs/marginal_utilities"
  save_interval: 100  # Save checkpoint every N queries
  resume_from: null  # Path to checkpoint to resume from (null = start fresh)
  kaggle_dataset: "juandatan/mini-imagenet-utility-checkpoints-idefics2"  # Kaggle dataset for checkpoint persistence

# Output configuration
output:
  save_dir: "outputs/marginal_utilities"
  save_format: "pickle"  # Format: pickle, json, or hdf5
  save_individual_results: false  # Save per-query results or only final aggregation
  log_interval: 10  # Log progress every N queries

# Logging configuration
logging:
  use_wandb: true  # Enable Weights & Biases logging
  wandb_project: "icl-retrieval-multimodal"
  wandb_entity: null  # Your WandB username/team (null = default)
  wandb_mode: "online"  # online, offline, or disabled
  log_frequency: 10  # Log metrics every N batches
  save_artifacts: true  # Save outputs as WandB artifacts

# Resource limits (optional)
limits:
  max_queries: null  # Limit number of queries to process (null = all)
  timeout_per_query: 300  # Timeout in seconds per query (null = no limit)
  memory_limit_gb: null  # Memory limit in GB (null = no limit)
