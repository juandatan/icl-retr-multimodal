experiment:
  name: auto
  seed: 40

data:
  artifact_path: /workspace/icl-artifacts/cub-200-reranker-teacher-data-v2/reranker_teacher_data.pkl
  probe_cache_path: /workspace/icl-artifacts/frozen-idefics2-probe-cache
  # Paper-aligned choices without a K-way score softmax:
  #   mean_token_probability
  #   normalized_incremental_mean_token_probability
  # The existing true_probability variants are K=32 softmax ablations.
  target: mean_token_probability
  target_temperature: 1.0
  incremental_lambda: 1.0
  batch_size: 128
  num_workers: 0

model:
  # Options: linear, layernorm_mlp. Keep linear for the original accessibility
  # probe; layernorm_mlp tests nonlinear extraction from the identical cache.
  architecture: linear
  hidden_dim: 256
  dropout: 0.0

objective:
  # Options: pointwise_bce, pairwise, pointwise_pairwise,
  # hybrid_listwise_pairwise. Pairwise comparisons are formed only within each
  # query's retrieved exemplar pool.
  name: pointwise_bce
  hybrid_pairwise_weight: 0.1
  hybrid_listwise_weight: 0.1
  pairwise_min_target_gap: 0.02
  pairwise_score_temperature: 1.0
  # Optional top-of-order weighting. When set, a query-local softmax over
  # teacher probabilities weights pairs containing high-utility candidates.
  # Lower values concentrate weight more strongly. Keep null for the first
  # hybrid run so only the objective composition changes.
  pairwise_teacher_weight_temperature: null

optimization:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 8

output:
  dir: outputs/frozen_idefics2_probe_training
