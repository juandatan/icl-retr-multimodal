# Reranker Training Configuration - Stanford Cars (Idefics2)
# n=50 candidates per query (full pool), ranking loss with per-epoch resampling

experiment:
  name: "reranker_stanford_cars_idefics2_n50"
  description: "Patch cross-attention reranker for Stanford Cars Idefics2 marginal utilities, top-50 candidates"
  seed: 42

data:
  dataset_name: "stanford_cars"
  use_embeddings: false
  results_path: "outputs/marginal_utilities/marginal_utility_stanford_cars_idefics2/marginal_utilities.pkl"

  kaggle_results_path: "/kaggle/input/datasets/juandatan/stanford-cars-idefics2-marginal-utilities/marginal_utilities.pkl"

  # Directory to save/load pre-extracted patch feature caches (speeds up repeated runs)
  patch_cache_dir: "outputs/patch_caches/stanford_cars_idefics2"

  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

  top_k: 50
  contrastive_mode: "contrastive"

model:
  architecture: "patch_attention"
  clip_model_name: "ViT-B/32"
  hidden_dim: 256
  num_attention_heads: 8
  num_attention_layers: 2
  feedforward_dims: [256, 128]
  dropout: 0.2
  freeze_clip: true
  pooling_method: "cls"  # "cls", "mean", "max", or "learned"
  use_sigmoid: false
  image_size: 224

training:
  batch_size: 64
  num_epochs: 50
  learning_rate: 3e-5
  weight_decay: 1e-3
  gradient_clip: 1.0
  early_stopping_patience: 15
  loss_type: "ranking"
  ranking_margin: 0.3
  pairs_per_query: 50
  normalize_utilities: false

  lr_scheduler: "cosine"

checkpoint:
  enabled: true
  save_dir: "outputs/reranker_checkpoints"
  save_best_only: false
  save_interval: 10
  overwrite: false

logging:
  use_wandb: false
  wandb_project: "icl-retrieval-multimodal"
  log_interval: 10

use_mps: true
