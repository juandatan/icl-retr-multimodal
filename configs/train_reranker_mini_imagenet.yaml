# Reranker Training Configuration - Mini-ImageNet
# Optimized based on initial training results

# Experiment metadata
experiment:
  name: "reranker_mini_imagenet_v2"
  description: "Improved MLP reranker for Mini-ImageNet with interaction features"
  seed: 42

# Data configuration
data:
  # Local paths
  results_path: "outputs/marginal_utilities/marginal_utility_mini_imagenet/marginal_utilities_train.pkl"
  embeddings_path: "data/mini_imagenet/clip_embeddings_train.pkl"

  # Kaggle paths
  kaggle_results_path: "/kaggle/input/mini-imagenet-marginal-utilities/marginal_utilities_train.pkl"
  kaggle_embeddings_path: "/kaggle/input/mini-imagenet-clip/clip_embeddings_train.pkl"

  # Split ratios
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Model configuration
model:
  embedding_dim: 512  # CLIP ViT-B/32
  hidden_dims: [1024, 512, 256, 128]  # Same architecture as working baseline
  dropout: 0.1  # Same as baseline

  # Interaction features - ENABLE THESE for better performance
  use_product: true  # Element-wise product captures joint patterns
  use_difference: true  # Difference captures contrast
  use_l2_distance: true  # Distance provides geometric info

# Training configuration
training:
  batch_size: 256  # Same as baseline
  num_epochs: 100  # Same as baseline
  learning_rate: 1e-4  # Same as baseline - critical for stability
  weight_decay: 1e-5  # Same as baseline
  gradient_clip: 1.0
  early_stopping_patience: 20  # More patience for ranking loss convergence

  # Loss function - ranking loss for better top-K quality
  loss_type: "huber"
  huber_delta: 0.5  # Not used with ranking loss
  ranking_margin: 0.1  # Margin for ranking loss
  pairs_per_query: 20  # Number of pairs per query for ranking loss

# Checkpoint configuration
checkpoint:
  enabled: true
  save_dir: "outputs/reranker_checkpoints"
  save_best_only: false
  save_interval: 10

# Logging configuration
logging:
  use_wandb: false
  wandb_project: "icl-retrieval-multimodal"
  log_interval: 10

# Device configuration
use_mps: true
