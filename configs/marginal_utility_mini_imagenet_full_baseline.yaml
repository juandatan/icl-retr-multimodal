# Marginal Utility Computation - Mini-ImageNet Full (100 Classes) - BASELINE
# This config computes marginal utilities on ALL 100 classes without contrastiveness improvements
#
# Differences from standard config:
# - Uses train_ratio: 1.0 to include all 100 classes (no class splitting)
# - Disables stratified sampling (use_stratified_sampling: false)
# - Uses simple top-k retrieval for baseline comparison

# Experiment metadata
experiment:
  name: "marginal_utility_mini_imagenet_full_baseline"
  description: "Marginal utilities for all 100 Mini-ImageNet classes WITHOUT contrastiveness improvements"
  tags: ["icl", "marginal_utility", "mini_imagenet", "full_100_classes", "baseline", "no_stratification"]
  seed: 42

# Dataset configuration - ALL 100 CLASSES
dataset:
  name: "mini_imagenet"
  split: "train"  # Use train split but with ALL classes (train_ratio=1.0)
  class_split_seed: 42
  train_ratio: 1.0  # Use all 100 classes (no class splitting)
  val_ratio: 0.0    # No validation classes
  cache_dir: "data/mini_imagenet"
  cache_dataset_locally: false  # Disable to save disk space in multi-GPU runs

# Retrieval configuration - BASELINE (no stratified sampling)
retrieval:
  method: "clip_similarity"
  clip_model: "ViT-B/32"
  top_k: 30  # Number of candidates to retrieve per query
  exclude_same_class: false
  use_train_as_pool: true

  # DISABLED: No stratified sampling for baseline
  use_stratified_sampling: false
  pool_size: 500  # Still retrieve from larger pool for consistency

# Model configuration
model:
  name: "llava-hf/llava-1.5-7b-hf"
  load_in_8bit: false
  load_in_4bit: false
  device_map: "auto"
  torch_dtype: "float16"

# Computation configuration
computation:
  batch_size: 1
  baseline_batch_size: 1
  num_workers: 0
  cache_baselines: true
  baseline_cache_path: "data/mini_imagenet/baseline_probs_full_baseline_{split}.pkl"

# Checkpoint configuration
checkpoint:
  enabled: true
  save_dir: "outputs/marginal_utilities"
  save_interval: 100
  resume_from: null

# Output configuration
output:
  save_dir: "outputs/marginal_utilities"
  save_format: "pickle"
  save_individual_results: false
  log_interval: 10

# Logging configuration
logging:
  use_wandb: true
  wandb_project: "icl-retrieval-multimodal"
  wandb_entity: null
  wandb_mode: "online"
  log_frequency: 10
  save_artifacts: true

# Resource limits
limits:
  max_queries: null  # Process all queries
  timeout_per_query: 300
  memory_limit_gb: null
